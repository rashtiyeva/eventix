databaseChangeLog:
  - changeSet:
      id: 01-create-events-table
      author: you

      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(5000)
                  constraints:
                    nullable: false

              - column:
                  name: category
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: location
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: start_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: end_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: capacity
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: organizer_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: deleted_at
                  type: TIMESTAMP