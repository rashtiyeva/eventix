databaseChangeLog:

  - changeSet:
      id: 04-add-saga-id-to-ticket-outbox
      author: ticker-service

      changes:

        - addColumn:
            tableName: ticket_outbox
            columns:
              - column:
                  name: saga_id
                  type: VARCHAR(36)
                  defaultValue: TEMP_SAGA_ID
                  constraints:
                    nullable: false

        - createIndex:
            tableName: ticket_outbox
            indexName: idx_ticket_outbox_saga_id
            columns:
              - column:
                  name: saga_id