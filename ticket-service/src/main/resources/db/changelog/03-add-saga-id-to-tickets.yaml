databaseChangeLog:

  - changeSet:
      id: 03-add-saga-id-to-tickets
      author: ticker-service

      changes:

        - addColumn:
            tableName: tickets
            columns:
              - column:
                  name: saga_id
                  type: VARCHAR(36)
                  defaultValue: TEMP_SAGA_ID
                  constraints:
                    nullable: false

        - createIndex:
            tableName: tickets
            indexName: idx_tickets_saga_id
            columns:
              - column:
                  name: saga_id