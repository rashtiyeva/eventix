databaseChangeLog:

    - changeSet:
          id: 07-refresh-tokens-session-fk
          author: auth-service

          changes:
              - addForeignKeyConstraint:
                    baseTableName: refresh_tokens
                    baseColumnNames: session_id
                    referencedTableName: sessions
                    referencedColumnNames: id
                    constraintName: fk_refresh_tokens_session
                    onDelete: CASCADE