databaseChangeLog:

  - changeSet:
      id: 06-create-refresh-tokens-table
      author: auth-service
      changes:

        - createTable:
            tableName: refresh_tokens
            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true

              - column:
                  name: token_hash
                  type: VARCHAR(44)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: session_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false