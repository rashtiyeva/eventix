databaseChangeLog:

  - changeSet:
      id: 14-create-user-recovery-codes-table
      author: auth-service

      createTable:
        tableName: user_recovery_codes

        columns:
          - column:
              name: id
              type: BIGSERIAL
              constraints:
                primaryKey: true
                nullable: false

          - column:
              name: user_id
              type: BIGINT
              constraints:
                nullable: false

          - column:
              name: code_hash
              type: VARCHAR(255)
              constraints:
                nullable: false

          - column:
              name: used
              type: BOOLEAN
              defaultValueBoolean: false
              constraints:
                nullable: false

          - column:
              name: created_at
              type: TIMESTAMP
              constraints:
                nullable: false

          - column:
              name: used_at
              type: TIMESTAMP
              constraints:
                nullable: true