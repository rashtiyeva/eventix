databaseChangeLog:
  - changeSet:
      id: 13-oauth2-identities-indexes
      author: auth-service

      changes:

        - addUniqueConstraint:
            tableName: oauth2_identities
            columnNames: provider, provider_user_id
            constraintName: uk_provider_provider_user_id

        - createIndex:
            tableName: oauth2_identities
            indexName: idx_oauth2_identities_user_id

            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: oauth2_identities
            indexName: idx_oauth2_identities_email

            columns:
              - column:
                  name: email