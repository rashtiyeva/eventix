databaseChangeLog:
  - changeSet:
      id: 11-create-oauth2-identities-table
      author: auth-service

      changes:
        - createTable:
            tableName: oauth2_identities

            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: provider
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: provider_user_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)

              - column:
                  name: email_verified
                  type: BOOLEAN
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false