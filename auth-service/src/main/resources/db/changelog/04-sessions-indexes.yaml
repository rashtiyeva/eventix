databaseChangeLog:

  - changeSet:
      id: 04-sessions-indexes
      author: auth-service

      changes:

        - createIndex:
            indexName: idx_sessions_user_id
            tableName: sessions
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_sessions_status
            tableName: sessions
            columns:
              - column:
                  name: status

        - createIndex:
            indexName: idx_sessions_last_used_at
            tableName: sessions
            columns:
              - column:
                  name: last_used_at