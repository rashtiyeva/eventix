databaseChangeLog:

  - changeSet:
      id: 01-create-notifications-table
      author: you

      createTable:
        tableName: notifications

        columns:

          - column:
              name: id
              type: BIGINT
              autoIncrement: true
              constraints:
                primaryKey: true
                nullable: false

          - column:
              name: event_id
              type: VARCHAR(255)
              constraints:
                nullable: false
                unique: true

          - column:
              name: user_id
              type: BIGINT

          - column:
              name: email
              type: VARCHAR(255)
              constraints:
                nullable: false

          - column:
              name: type
              type: VARCHAR(50)

          - column:
              name: status
              type: VARCHAR(50)

          - column:
              name: template_key
              type: VARCHAR(255)

          - column:
              name: subject
              type: VARCHAR(500)

          - column:
              name: body
              type: VARCHAR(5000)

          - column:
              name: retry_count
              type: INT

          - column:
              name: created_at
              type: TIMESTAMP

          - column:
              name: sent_at
              type: TIMESTAMP

          - column:
              name: error_message
              type: VARCHAR(1000)